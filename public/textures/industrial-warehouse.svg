<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2126"/>
      <stop offset="55%" stop-color="#12161a"/>
      <stop offset="100%" stop-color="#0b0e11"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151a1f"/>
      <stop offset="100%" stop-color="#0a0d10"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a424a"/>
      <stop offset="50%" stop-color="#5a646e"/>
      <stop offset="100%" stop-color="#3a424a"/>
    </linearGradient>
    <linearGradient id="upright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a525a"/>
      <stop offset="100%" stop-color="#2a3036"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0e11" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0e11" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lightPool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8d0d8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c8d0d8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="deck" width="40" height="18" patternUnits="userSpaceOnUse">
      <rect width="40" height="18" fill="#1a1f24"/>
      <path d="M0 17.5H40" stroke="#2e353c" stroke-width="1"/>
      <path d="M0 0V18" stroke="#242a30" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- warehouse shell -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- ceiling structure -->
  <g stroke="#2a3138" stroke-width="2" opacity="0.7">
    <path d="M0 80 H1600"/>
    <path d="M0 130 H1600"/>
    <path d="M0 40 L800 110 L1600 40" fill="none"/>
    <path d="M0 160 L800 100 L1600 160" fill="none"/>
  </g>
  <!-- hanging lights -->
  <g opacity="0.55">
    <rect x="280" y="96" width="70" height="6" rx="1" fill="#8a939c"/>
    <rect x="760" y="88" width="70" height="6" rx="1" fill="#8a939c"/>
    <rect x="1240" y="96" width="70" height="6" rx="1" fill="#8a939c"/>
    <ellipse cx="315" cy="220" rx="90" ry="130" fill="url(#lightPool)"/>
    <ellipse cx="795" cy="210" rx="90" ry="130" fill="url(#lightPool)"/>
    <ellipse cx="1275" cy="220" rx="90" ry="130" fill="url(#lightPool)"/>
  </g>

  <!-- left racking run -->
  <g>
    <!-- uprights -->
    <rect x="60" y="170" width="14" height="560" fill="url(#upright)"/>
    <rect x="220" y="170" width="14" height="560" fill="url(#upright)"/>
    <rect x="380" y="170" width="14" height="560" fill="url(#upright)"/>
    <!-- beams + decking -->
    <g>
      <rect x="60" y="200" width="334" height="10" fill="url(#beam)"/>
      <rect x="60" y="210" width="334" height="46" fill="url(#deck)" opacity="0.9"/>
      <rect x="60" y="320" width="334" height="10" fill="url(#beam)"/>
      <rect x="60" y="330" width="334" height="46" fill="url(#deck)" opacity="0.9"/>
      <rect x="60" y="440" width="334" height="10" fill="url(#beam)"/>
      <rect x="60" y="450" width="334" height="46" fill="url(#deck)" opacity="0.9"/>
      <rect x="60" y="560" width="334" height="10" fill="url(#beam)"/>
      <rect x="60" y="570" width="334" height="46" fill="url(#deck)" opacity="0.9"/>
      <rect x="60" y="680" width="334" height="10" fill="url(#beam)"/>
      <rect x="60" y="690" width="334" height="40" fill="url(#deck)" opacity="0.9"/>
    </g>
    <!-- pallets / cartons silhouettes -->
    <g fill="#252b31" opacity="0.95">
      <rect x="86" y="248" width="70" height="56" rx="2"/>
      <rect x="170" y="256" width="54" height="48" rx="2"/>
      <rect x="90" y="368" width="60" height="56" rx="2"/>
      <rect x="168" y="376" width="78" height="48" rx="2"/>
      <rect x="86" y="488" width="88" height="56" rx="2"/>
      <rect x="190" y="500" width="48" height="44" rx="2"/>
      <rect x="96" y="608" width="64" height="56" rx="2"/>
      <rect x="176" y="616" width="70" height="48" rx="2"/>
    </g>
    <g fill="#3a424a" opacity="0.5">
      <rect x="250" y="250" width="58" height="54" rx="2"/>
      <rect x="318" y="258" width="48" height="46" rx="2"/>
      <rect x="252" y="370" width="72" height="54" rx="2"/>
      <rect x="250" y="490" width="56" height="54" rx="2"/>
      <rect x="320" y="502" width="46" height="42" rx="2"/>
      <rect x="254" y="610" width="80" height="54" rx="2"/>
    </g>
  </g>

  <!-- center aisle floor -->
  <rect x="0" y="730" width="1600" height="170" fill="url(#floor)"/>
  <g stroke="#3a424a" stroke-width="2" opacity="0.45" stroke-dasharray="28 22">
    <path d="M0 810 H1600"/>
  </g>
  <g stroke="#2a3138" stroke-width="1" opacity="0.5">
    <path d="M0 760 H1600"/>
    <path d="M0 860 H1600"/>
  </g>

  <!-- right racking run (mirrored feel) -->
  <g>
    <rect x="1206" y="170" width="14" height="560" fill="url(#upright)"/>
    <rect x="1366" y="170" width="14" height="560" fill="url(#upright)"/>
    <rect x="1526" y="170" width="14" height="560" fill="url(#upright)"/>
    <g>
      <rect x="1206" y="200" width="334" height="10" fill="url(#beam)"/>
      <rect x="1206" y="210" width="334" height="46" fill="url(#deck)" opacity="0.9"/>
      <rect x="1206" y="320" width="334" height="10" fill="url(#beam)"/>
      <rect x="1206" y="330" width="334" height="46" fill="url(#deck)" opacity="0.9"/>
      <rect x="1206" y="440" width="334" height="10" fill="url(#beam)"/>
      <rect x="1206" y="450" width="334" height="46" fill="url(#deck)" opacity="0.9"/>
      <rect x="1206" y="560" width="334" height="10" fill="url(#beam)"/>
      <rect x="1206" y="570" width="334" height="46" fill="url(#deck)" opacity="0.9"/>
      <rect x="1206" y="680" width="334" height="10" fill="url(#beam)"/>
      <rect x="1206" y="690" width="334" height="40" fill="url(#deck)" opacity="0.9"/>
    </g>
    <g fill="#252b31" opacity="0.95">
      <rect x="1232" y="248" width="70" height="56" rx="2"/>
      <rect x="1320" y="256" width="64" height="48" rx="2"/>
      <rect x="1400" y="252" width="58" height="52" rx="2"/>
      <rect x="1236" y="368" width="80" height="56" rx="2"/>
      <rect x="1330" y="376" width="70" height="48" rx="2"/>
      <rect x="1234" y="488" width="66" height="56" rx="2"/>
      <rect x="1316" y="500" width="84" height="44" rx="2"/>
      <rect x="1240" y="608" width="74" height="56" rx="2"/>
      <rect x="1330" y="616" width="68" height="48" rx="2"/>
    </g>
    <g fill="#3a424a" opacity="0.45">
      <rect x="1470" y="250" width="52" height="54" rx="2"/>
      <rect x="1472" y="370" width="60" height="54" rx="2"/>
      <rect x="1468" y="490" width="54" height="54" rx="2"/>
      <rect x="1474" y="610" width="62" height="54" rx="2"/>
    </g>
  </g>

  <!-- far end wall / depth -->
  <rect x="420" y="300" width="760" height="430" fill="#101418"/>
  <g stroke="#1e242a" stroke-width="2" opacity="0.8">
    <path d="M420 360 H1180"/>
    <path d="M420 430 H1180"/>
    <path d="M420 500 H1180"/>
    <path d="M420 570 H1180"/>
    <path d="M420 640 H1180"/>
    <path d="M540 300 V730"/>
    <path d="M660 300 V730"/>
    <path d="M780 300 V730"/>
    <path d="M900 300 V730"/>
    <path d="M1020 300 V730"/>
    <path d="M1140 300 V730"/>
  </g>
  <!-- distant doorway light -->
  <rect x="740" y="470" width="120" height="260" fill="#1a2026"/>
  <rect x="752" y="482" width="96" height="248" fill="#252c33" opacity="0.9"/>
  <rect x="768" y="500" width="64" height="230" fill="#3a424a" opacity="0.35"/>

  <!-- atmosphere -->
  <rect width="1600" height="900" fill="url(#fog)" opacity="0.55"/>
  <!-- subtle vignette for readability -->
  <radialGradient id="vig" cx="50%" cy="45%" r="75%">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="70%" stop-color="#000" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
